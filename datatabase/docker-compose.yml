services:
  db:
    image: mysql:8.0
    container_name: mysql_kanban
    restart: always
    environment:
      # Credenziali richieste
      MYSQL_ROOT_PASSWORD: Password123
      MYSQL_DATABASE: kanban_db
    ports:
      - "3306:3306"
    volumes:
      # Salva i dati in una cartella locale così non li perdi
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pma_kanban
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      # Permette di accedere senza configurazioni extra
      PMA_ARBITRARY: 1

volumes:
  db_data:
